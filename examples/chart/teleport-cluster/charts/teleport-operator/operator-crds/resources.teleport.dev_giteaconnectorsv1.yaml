        description: GiteaConnectorV1 is the Schema for the giteaconnectorsv1 API
        properties:
          apiVersion:
            description: 'APIVersion defines the versioned schema of this representation
              of an object. Servers should convert recognized schemas to the latest
              internal value, and may reject unrecognized values. More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources'
            type: string
          kind:
            description: 'Kind is a string value representing the REST resource this
              object represents. Servers may infer this from the endpoint the client
              submits requests to. Cannot be updated. In CamelCase. More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds'
            type: string
          metadata:
            type: object
          spec:
            description: GiteaConnector resource definition v1 from Teleport
            properties:
              api_endpoint_url:
                description: api_endpoint_url is the base URL of the Gitea REST API.
                  It defaults to endpoint_url followed by /api/v1.
                type: string
              client_id:
                description: client_id is the client ID of the OAuth2 application
                  registered in Gitea.
                type: string
              client_redirect_settings:
                description: client_redirect_settings defines which client redirect
                  URLs are allowed for non-browser SSO logins other than the standard
                  localhost ones.
                nullable: true
                properties:
                  allowed_https_hostnames:
                    description: allowed_https_hostnames is a list of hostnames allowed
                      for HTTPS client redirect URLs. Each entry can be either a plain
                      hostname or a glob pattern.
                    items:
                      type: string
                    nullable: true
                    type: array
                  insecure_allowed_cidr_ranges:
                    description: insecure_allowed_cidr_ranges is a list of CIDRs allowed
                      for HTTP or HTTPS client redirect URLs.
                    items:
                      type: string
                    nullable: true
                    type: array
                type: object
              client_secret:
                description: client_secret is the client secret of the OAuth2 application
                  registered in Gitea. It is never returned to clients unless secrets
                  were explicitly requested. This field supports secret lookup. See
                  the operator documentation for more details.
                type: string
              display:
                description: display is the connector display name shown on the login
                  screen.
                type: string
              endpoint_url:
                description: endpoint_url is the base URL of the Gitea instance, for
                  example https://gitea.example.com. OAuth2 endpoints are resolved
                  relative to it.
                type: string
              redirect_url:
                description: redirect_url is the authorization callback URL registered
                  with the OAuth2 application, typically https://<proxy>/v1/webapi/gitea/callback.
                type: string
              teams_to_roles:
                description: teams_to_roles maps Gitea organization team memberships
                  onto Teleport roles.
                items:
                  properties:
                    organization:
                      description: organization is the name of the Gitea organization
                        the team belongs to.
                      type: string
                    roles:
                      description: roles is the list of Teleport roles granted to
                        members of the team.
                      items:
                        type: string
                      nullable: true
                      type: array
                    team:
                      description: team is the name of the team inside the organization.
                        Gitea teams have no slug, so the exact team name is matched.
                      type: string
                  type: object
                nullable: true
                type: array
              user_matchers:
                description: user_matchers is a set of glob patterns to narrow down
                  which username(s) this auth connector should match for identifier-first
                  login.
                items:
                  type: string
                nullable: true
                type: array
